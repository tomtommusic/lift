function calBox(c){
  if (!c) return `<div class="empty">Entre ton âge, ton poids et ta grandeur pour obtenir ton BMR et tes calories de maintien.</div>`;
  const bmr = c.katch ?? c.mif, main = c.maintK ?? c.maint;
  return `<div class="stack">
    <div class="calgrid">
      <div class="calcell"><span class="pill">BMR</span><span class="big">${Math.round(bmr).toLocaleString("fr-CA")}</span><span class="small muted">kcal / jour au repos complet</span></div>
      <div class="calcell"><span class="pill">Maintien</span><span class="big">${Math.round(main).toLocaleString("fr-CA")}</span><span class="small muted">kcal / jour avec ton activité</span></div>
    </div>
    <p class="small muted">Le BMR (métabolisme de base) est l'énergie que ton corps brûle juste pour fonctionner. Le maintien, c'est le BMR multiplié par ton niveau d'activité.</p>
    <div class="list">
      <div class="kv"><span>BMR selon Mifflin-St Jeor</span><span class="num">${Math.round(c.mif)}</span></div>
      <div class="kv"><span>Maintien selon Mifflin-St Jeor</span><span class="num">${Math.round(c.maint)}</span></div>
      ${c.katch ? `<div class="kv"><span>Masse maigre</span><span class="num">${fmtW(c.lbm*LBKG)} ${wU()}</span></div><div class="kv"><span>BMR selon Katch-McArdle</span><span class="num">${Math.round(c.katch)}</span></div><div class="kv"><span>Maintien selon Katch-McArdle</span><span class="num">${Math.round(c.maintK)}</span></div>` : ""}
    </div>
    <p class="small muted">${c.katch ? "Les chiffres principaux utilisent Katch-McArdle, plus précis quand le % de gras est connu. " : "Ajoute ton % de gras pour un calcul plus précis (Katch-McArdle). "}C'est une estimation : si ton poids bouge sur 2 ou 3 semaines à cet apport, ajuste de 100 à 200 kcal.</p>
  </div>`;
}

/* ================= notes de séance ================= */
function logSheet(exId, logId){
  const e = EX[exId]; if (!e) return;
  const existing = logId ? S.logs.find(l => l.id === logId) : null;
  const target = findTarget(exId), last = lastLog(exId);
  const sets = existing ? existing.sets.map(s => ({w:s.w, r:s.r})) : last ? last.sets.map(s => ({w:s.w, r:s.r})) : Array.from({length: (target && target.sets) || 3}, () => ({w:"", r:""}));
  const tempo = existing ? existing.tempo : (target?.tempo || last?.tempo || "");
  const isBar = e.eq === "Barre";
  openSheet(`
    <div><span class="eyebrow">${existing ? "Modifier l'entrée" : "Noter"}</span><h2>${esc(e.n)}</h2></div>
    ${target ? `<p class="small">Objectif : <b class="num">${esc(itemTxt(target))}</b>${target.tempo ? ` · tempo <b class="num">${esc(target.tempo)}</b>` : ""}${target.rest ? " · repos " + esc(target.rest) : ""}</p>` : e.cat !== "m" ? `<p class="small">Dosage suggéré : <b>${esc(e.r)}</b></p>` : ""}
    ${!existing && last ? `<p class="small muted">Prérempli avec ta séance du ${fmtD(last.d)}.</p>` : ""}
    <div class="field"><label for="lg-d">Date</label><input id="lg-d" type="date" value="${existing ? existing.d : today()}"></div>
    <div class="sethead"><span></span><span>#</span><span>Poids (${wU()})</span><span></span><span>${/\d\s?s\b/.test(e.r) ? "Secondes" : "Reps"}</span><span>Fait</span><span></span></div>
    <div class="sets" id="lg-sets"></div>
    <button class="btn sm" id="lg-add">+ Ajouter une série</button>
    ${isBar ? `<div class="plates" id="lg-plates"></div>` : ""}
    <div class="field"><label for="lg-t">Rythme d'exécution (tempo)</label><input id="lg-t" value="${esc(tempo)}" placeholder="3-1-1-0"><span class="hint">Descente – pause – montée – pause, en secondes</span></div>
    <div class="field"><label for="lg-n">Note</label><textarea id="lg-n" placeholder="Sensations, réglage de machine, prise…">${esc(existing?.note || "")}</textarea></div>
    <div class="row"><button class="btn primary grow" id="lg-save">Enregistrer</button><button class="btn" data-act="close">Annuler</button></div>`,
  sh => {
    const box = sh.querySelector("#lg-sets");
    const drawPlates = () => {
      const pl = sh.querySelector("#lg-plates"); if (!pl) return;
      const top = Math.max(0, ...sets.map(s => +s.w || 0)), r = plates(top);
      if (!r){ pl.innerHTML = `<span class="lbl">Disques par côté</span><span class="small muted">Entre une charge pour voir quoi mettre sur la barre.</span>`; return; }
      pl.innerHTML = `<span class="lbl">Disques par côté · charge max ${fmtN(toW(top),1)} ${wU()}</span>` + (r.under ? `<span class="small">Moins que la barre seule (${r.bar} ${wU()}).</span>` : `<div class="ps">${r.used.length ? r.used.map(x => `<span class="plate">${fmtN(x,2)}</span>`).join("") : `<span class="small">Barre seule</span>`}</div><span class="small muted">Barre olympique ${r.bar} ${wU()}${r.rest ? ` · il manque ${fmtN(r.rest,2)} ${wU()} par côté` : ""}</span>`);
    };
    const draw = () => {
      box.innerHTML = sets.map((s,k) => `<div class="setrow${s.done ? " done" : ""}"><span class="bar"></span><span class="n">${k+1}</span>
        <input type="number" inputmode="decimal" step="any" aria-label="Poids série ${k+1}" data-k="${k}" data-f="w" value="${s.w === "" ? "" : fmtN(toW(+s.w),1).replace(",",".")}" placeholder="${e.eq === "Poids du corps" ? "lest" : ""}">
        <span class="x">×</span>
        <input type="number" inputmode="numeric" aria-label="Reps série ${k+1}" data-k="${k}" data-f="r" value="${s.r}">
        <button class="ck" aria-label="Série ${k+1} faite" aria-pressed="${!!s.done}" data-ck="${k}">✓</button>
        <button class="iconbtn rm" aria-label="Retirer la série ${k+1}" data-rm="${k}">✕</button></div>`).join("");
      drawPlates();
    };
    box.addEventListener("input", ev => { const t = ev.target; if (!t.dataset.f) return; const k = +t.dataset.k;
      if (t.dataset.f === "w"){ const v = num(t.value); sets[k].w = isNaN(v) ? "" : fromW(v); drawPlates(); } else { const v = parseInt(t.value); sets[k].r = isNaN(v) ? "" : v; } });
    box.addEventListener("click", ev => { const c = ev.target.closest("[data-ck]"); if (c){ const k = +c.dataset.ck; sets[k].done = !sets[k].done; draw(); return; } const b = ev.target.closest("[data-rm]"); if (!b) return; sets.splice(+b.dataset.rm, 1); draw(); });
    sh.querySelector("#lg-add").onclick = () => { const l = sets[sets.length-1]; sets.push(l ? {w:l.w, r:l.r} : {w:"", r:""}); draw(); };
    sh.querySelector("#lg-save").onclick = () => {
      const clean = sets.filter(s => s.r !== "" && +s.r > 0).map(s => ({w: s.w === "" ? 0 : Math.round(+s.w*100)/100, r:+s.r}));
      if (!clean.length){ toast("Entre au moins une série avec des reps"); return; }
      const rec = {id: existing?.id || uid(), d: sh.querySelector("#lg-d").value || today(), ex: exId, sets: clean, tempo: sh.querySelector("#lg-t").value.trim(), note: sh.querySelector("#lg-n").value.trim()};
      if (existing){ Object.assign(existing, rec); delete existing.demo; } else S.logs.push(rec);
      save(); closeSheet(); render(); toast("Séance enregistrée");
    };
    draw();
  });
}
function histSheet(exId){
  const e = EX[exId]; if (!e) return;
  const draw = sh => {
    const L = logsFor(exId), byDate = {};
    for (const l of L){ const m = metrics(l); const v = S.ui.metric === "top" ? m.top : S.ui.metric === "vol" ? m.vol : m.e1rm; byDate[l.d] = Math.max(byDate[l.d] || 0, v); }
    const pts = Object.keys(byDate).sort().map(d => ({d, v: toW(byDate[d])}));
    const best = L.reduce((b,l) => Math.max(b, metrics(l).e1rm), 0), delta = pts.length > 1 ? pts[pts.length-1].v - pts[0].v : 0;
    sh.querySelector("#h-body").innerHTML = `
      <div class="stats">
        <div class="stat"><b>${L.length}</b><span>séances notées</span></div>
        <div class="stat"><b>${best ? fmtW(best) : "–"}</b><span>meilleur 1RM estimé (${wU()})</span></div>
        <div class="stat"><b>${pts.length > 1 ? (delta >= 0 ? "+" : "−") + fmtN(Math.abs(delta), S.ui.metric === "vol" ? 0 : 1) : "–"}</b><span>écart depuis le début</span></div>
      </div>
      <label class="row small" style="gap:8px;cursor:pointer"><input type="checkbox" id="h-chart" ${S.ui.chart ? "checked" : ""} style="width:20px;height:20px"> Afficher la courbe de progression</label>
      ${S.ui.chart ? `<div class="seg">${[["e1rm","1RM estimé"],["top","Charge max"],["vol","Volume"]].map(([k,l]) => `<button data-m="${k}" aria-pressed="${S.ui.metric===k}">${l}</button>`).join("")}</div>
        ${pts.length ? lineChart(pts, S.ui.metric === "vol" ? "" : wU()) : ""}
        <p class="small muted">${S.ui.metric === "e1rm" ? "1RM estimé avec la formule d'Epley : poids × (1 + reps ÷ 30), meilleure série de la séance." : S.ui.metric === "top" ? "Charge la plus lourde soulevée pendant la séance." : `Volume : somme poids × reps de toutes les séries (${wU()}).`}</p>` : ""}
      <div class="list hist">${L.map(l => `<div class="li">
        <div class="grow"><span class="t">${fmtD(l.d, true)}${l.demo ? ` <span class="tag">exemple</span>` : ""}</span><span class="s num">${setsTxt(l.sets)}</span>${l.tempo ? `<span class="s">Tempo <span class="num">${esc(l.tempo)}</span></span>` : ""}${l.note ? `<span class="s">${esc(l.note)}</span>` : ""}</div>
        <div class="stack" style="gap:6px"><button class="iconbtn" aria-label="Modifier" data-edit="${l.id}">✎</button><button class="iconbtn" aria-label="Supprimer" data-del="${l.id}">✕</button></div>
      </div>`).join("") || `<div class="empty">Aucune entrée.</div>`}</div>`;
  };
  openSheet(`<div><span class="eyebrow">Historique</span><h2>${esc(e.n)}</h2></div><div id="h-body" class="stack"></div>
    <div class="row"><button class="btn primary grow" data-act="logEx" data-ex="${exId}">Noter une séance</button><button class="btn" data-act="close">Fermer</button></div>`,
  sh => {
    draw(sh);
    sh.addEventListener("change", ev => { if (ev.target.id === "h-chart"){ S.ui.chart = ev.target.checked; save(); draw(sh); } });
    sh.addEventListener("click", ev => {
      const m = ev.target.closest("[data-m]"); if (m){ S.ui.metric = m.dataset.m; save(); draw(sh); return; }
      const ed = ev.target.closest("[data-edit]"); if (ed){ logSheet(exId, ed.dataset.edit); return; }
      const del = ev.target.closest("[data-del]"); if (del){ if (!armed(del)) return; S.logs = S.logs.filter(l => l.id !== del.dataset.del); save(); draw(sh); render(); }
    });
  });
}

/* ================= actions ================= */
const D = () => S.draft.prog;
const A = {
  go: t => { if (t.dataset.tab === "seance"){ startSession(); return; } go(t.dataset.tab); },
  close: () => closeSheet(),
  nextQuote: () => { QI = (QI + 1 + Math.floor(Math.random()*(QUOTES.length-1))) % QUOTES.length; render(); },
  startSession: () => startSession(),
  changeActive: () => changeActiveSheet(),
  goPrograms: () => { closeSheet(); go("programmes"); },
  setActive: t => { S.active = t.dataset.id; S.ui.jday = Math.max(0, todayIdx(prog())); save(); closeSheet(); render(); toast("Programme actif changé"); },
  jday: t => { S.ui.jday = +t.dataset.i; save(); render(); },
  bfSheet: () => bfSheet(),
  newProg: () => newProgSheet(),
  genProg: () => genSheet(),
  editProg: t => openDraft(S.programs.find(p => p.id === t.dataset.id), false),
  dupProg: t => { const p = clone(S.programs.find(x => x.id === t.dataset.id)); p.id = uid(); p.name += " (copie)"; openDraft(p, true); },
  delProg: t => { if (!armed(t)) return; S.programs = S.programs.filter(p => p.id !== t.dataset.id); if (S.active === t.dataset.id) S.active = S.programs[0]?.id || null; save(); render(); toast("Programme supprimé"); },
  saveProg: () => {
    const p = D(); if (!p.name.trim()) p.name = "Mon programme";
    const i = S.programs.findIndex(x => x.id === p.id);
    if (i >= 0) S.programs[i] = clone(p); else S.programs.push(clone(p));
    if (!S.active) S.active = p.id;
    S.draft = null; S.pick = null; save(); render(); window.scrollTo(0,0);
    toast(S.active === p.id ? "Programme enregistré et actif" : "Programme enregistré");
  },
  cancelEdit: t => { if (dirty() && !armed(t, "Abandonner ?")) return; S.draft = null; S.pick = null; save(); render(); window.scrollTo(0,0); },
  addDay: () => { D().days.push({id:uid(), name:"Jour " + (D().days.length+1), wd:-1, items:[]}); save(); render(); },
  delDay: t => { if (!armed(t)) return; D().days.splice(+t.dataset.i, 1); save(); render(); },
  mv: t => { const d = D().days[+t.dataset.i], j = +t.dataset.j, k = j + (+t.dataset.dir); if (k < 0 || k >= d.items.length) return; [d.items[j], d.items[k]] = [d.items[k], d.items[j]]; save(); render(); },
  editItem: t => editItemSheet(+t.dataset.i, +t.dataset.j),
  delItem: t => { D().days[+t.dataset.i].items.splice(+t.dataset.j, 1); save(); render(); },
  pickFor: t => { S.pick = {i: +t.dataset.i}; go("exercices"); },
  cancelPick: () => { S.pick = null; go("programmes"); },
  addPicked: (t, ev) => { ev.stopPropagation(); addToDay(S.pick.i, t.dataset.ex); },
  fCat: t => { S.ui.cat = t.dataset.v; save(); render(); },
  fMuscle: t => { S.ui.muscle = t.dataset.v; save(); render(); },
  fEquip: t => { S.ui.equip = t.dataset.v; save(); render(); },
  exDetail: t => exDetail(t.dataset.ex),
  newEx: () => exFormSheet(null),
  editEx: t => exFormSheet(t.dataset.ex),
  delEx: t => { if (!armed(t)) return; S.custom = S.custom.filter(c => c.id !== t.dataset.ex); rebuildEx(); save(); closeSheet(); render(); toast("Exercice supprimé"); },
  rmPhoto: t => { delete S.imgs[t.dataset.ex]; save(); exDetail(t.dataset.ex); render(); },
  logEx: t => logSheet(t.dataset.ex),
  logAny: () => logSheet($("#j-any").value),
  hist: t => histSheet(t.dataset.ex),
  clearDemo: t => { if (!armed(t)) return; S.logs = S.logs.filter(l => !l.demo); save(); render(); toast("Exemples effacés"); },
  sex: t => { S.profile.sex = t.dataset.v; save(); render(); },
  unitW: t => { S.units.w = t.dataset.v; save(); render(); },
  unitH: t => { S.units.h = t.dataset.v; save(); render(); },
  logWeight: () => { if (!S.profile.wlb){ toast("Entre d'abord ton poids"); return; } const t = today(); S.weights = S.weights.filter(w => w.d !== t); S.weights.push({id:uid(), d:t, lb:+S.profile.wlb}); save(); render(); toast("Pesée enregistrée"); },
  delWeight: t => { if (!armed(t)) return; S.weights = S.weights.filter(w => w.id !== t.dataset.id); save(); render(); },
  exportData: async () => { const txt = JSON.stringify(S), ta = $("#backup"); try { await navigator.clipboard.writeText(txt); toast("Sauvegarde copiée"); } catch(e){ ta.value = txt; ta.select(); toast("Sauvegarde sélectionnée : copie-la manuellement"); } },
  importData: t => { const ta = $("#backup"); let o; try { o = migrate(JSON.parse(ta.value)); } catch(e){ toast("Ce texte n'est pas une sauvegarde Lift valide"); return; } if (!o || o.v !== 2 || !Array.isArray(o.logs)){ toast("Ce texte n'est pas une sauvegarde Lift valide"); return; } if (!armed(t)) return; S = o; normalize(); save(); render(); toast("Données restaurées"); }
};

document.addEventListener("click", ev => {
  if (ev.target.matches("[data-scrim]")){ closeSheet(); return; }
  const t = ev.target.closest("[data-act]"); if (!t) return;
  const f = A[t.dataset.act]; if (!f) return;
  if (t.tagName === "A") ev.preventDefault();
  f(t, ev);
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && $("#sheetRoot").innerHTML) closeSheet(); });
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.dataset.lib === "q"){ S.ui.q = t.value; save(); $("#libList").innerHTML = libList(); return; }
  if (t.dataset.p){
    const P = S.profile, k = t.dataset.p;
    if (k === "name") P.name = t.value;
    else if (k === "age") P.age = t.value;
    else if (k === "bf") P.bf = t.value;
    else if (k === "w"){ const v = num(t.value); P.wlb = isNaN(v) ? "" : fromW(v); }
    else if (k === "cm"){ const v = num(t.value); P.hcm = isNaN(v) ? "" : v; }
    else if (k === "ft" || k === "in"){ const ft = num($("#p-ft").value) || 0, inch = num($("#p-in").value) || 0; P.hcm = (ft || inch) ? (ft*12 + inch)*2.54 : ""; }
    else if (k === "act") P.act = +t.value;
    save(); const cb = $("#calBox"); if (cb) cb.innerHTML = calBox(calories()); return;
  }
  if (S.draft && t.dataset.pg === "name"){ D().name = t.value; save(); return; }
  if (S.draft && t.dataset.dk === "name"){ D().days[+t.dataset.day].name = t.value; save(); }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (S.draft && t.dataset.dk === "wd"){ D().days[+t.dataset.day].wd = +t.value; save(); render(); }
  if (t.dataset.p === "act"){ S.profile.act = +t.value; save(); const cb = $("#calBox"); if (cb) cb.innerHTML = calBox(calories()); }
  if (S.draft && (t.dataset.pg === "name" || t.dataset.dk === "name")) render();
});
document.querySelectorAll(".tabs a, .brand").forEach(a => a.addEventListener("click", ev => { ev.preventDefault(); const tab = a.dataset.tab || a.dataset.tabl; if (S.pick && tab !== "exercices") S.pick = null; go(tab); }));
window.addEventListener("hashchange", () => render());

load();
render();
if ("serviceWorker" in navigator && location.protocol === "https:") { window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {})); }
</script>

</body>
</html>
