<meta name="description" content="Lift : suivi d'entraînement, programmes, exercices et progression.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift">
<link rel="manifest" href="manifest.webmanifest">

<link rel="icon" href="icons/favicon-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Lift</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;1,800&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: dark gym-floor app, graphite cards, one electric blue for actions and progress (chosen for colour-blind safety), pill controls, hexagon start button at the thumb. Single dark theme by design. */
:root{
  --bg:#0B0C0F; --surface:#16181D; --surface2:#20232A; --line:#2A2E36;
  --ink:#F3F5F8; --muted:#A3A9B4; --accent:#3D9BFF; --accent-deep:#2479E0; --on-accent:#04101F;
  --accent-soft:rgba(61,155,255,.15); --base:#363B45; --hatch:#D4D8DF; --danger:#FF7A6E;
  --fig:#D9DDE4; --fig2:#737985; --prop:#2C3039; --eqc:#B9BFC9;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:18px; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);background-image:radial-gradient(110% 55% at 100% -10%,rgba(61,155,255,.10),transparent 60%);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:rgba(11,12,15,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .in{max-width:600px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-display);font-style:italic;font-weight:800;font-size:30px;letter-spacing:.03em;line-height:1;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.brand .brandlogo{width:38px;height:38px;border-radius:50%;object-fit:cover;box-shadow:0 0 12px rgba(61,155,255,.45)}
.brand em{font-style:inherit;color:var(--accent)}
.gear{appearance:none;border:1px solid var(--line);background:var(--surface);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.gear svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.gear[aria-current="page"]{border-color:var(--accent)}
.gear[aria-current="page"] svg{stroke:var(--accent)}

.wrap{max-width:600px;margin:0 auto;padding-block:20px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-body);text-wrap:balance;margin:0;line-height:1.12}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:19px;font-weight:700}
h3{font-size:17px;font-weight:700}
.eyebrow{font-weight:600;font-size:13px;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
p{margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.link{color:var(--ink);font-size:15px;font-weight:600;text-decoration:none;background:none;border:0;cursor:pointer;padding:6px 0}
.pill{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;padding:4px 10px;border-radius:999px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--surface2);border:1px solid var(--line);color:var(--ink)}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:999px;min-height:48px;padding:10px 18px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);box-shadow:0 8px 24px rgba(61,155,255,.25)}
.btn.primary:active{background:var(--accent-deep)}
.btn.sm{min-height:38px;padding:6px 14px;font-size:14px}
.btn.full{width:100%}
.btn.danger{color:var(--danger);border-color:rgba(255,122,110,.45);background:transparent}
.btn.armed,.iconbtn.armed{background:var(--danger);color:#1A0503;border-color:var(--danger)}
.iconbtn{appearance:none;border:1px solid var(--line);background:var(--surface2);border-radius:12px;width:38px;height:38px;display:inline-grid;place-items:center;cursor:pointer;font-weight:700;color:var(--ink);flex:0 0 auto}
.iconbtn:disabled{opacity:.35;cursor:default}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.wrapchips{flex-wrap:wrap;overflow:visible}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer;min-height:38px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:800}
.chip[aria-pressed="true"]::before{content:"✓ "}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;appearance:none;border:0;background:transparent;border-radius:999px;padding:8px 6px;font-weight:600;cursor:pointer;min-height:40px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:800}

.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-weight:600;font-size:14px;color:var(--muted)}
.field input,.field select,.field textarea,.inp{width:100%;min-height:48px;border:1px solid var(--line);background:var(--surface2);border-radius:14px;padding:10px 12px}
.field input:focus,.inp:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{min-height:90px;resize:vertical}
.field .hint{font-size:13px;color:var(--muted)}
.unit-in{display:flex;align-items:center;gap:8px}
.unit-in input{flex:1;min-width:0}
.unit-in span{font-size:14px;color:var(--muted);font-weight:600}

.hello h1{font-size:32px}
.hello p{color:var(--muted);font-size:16px}
.quote{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px 16px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.quote::before{content:"“";position:absolute;right:12px;top:-36px;font-family:Georgia,serif;font-size:150px;line-height:1;color:var(--accent);opacity:.9}
.quote blockquote{margin:0;font-family:var(--f-display);font-style:italic;font-weight:800;font-size:clamp(26px,7.4vw,36px);line-height:1.05;text-transform:uppercase;text-wrap:balance;max-width:20ch;position:relative}
.quote cite{font-style:normal;font-weight:700}
.quote .tr{font-size:13px;color:var(--muted)}
.start{appearance:none;width:100%;text-align:left;cursor:pointer;color:var(--on-accent);background:var(--accent);border:0;border-radius:22px;padding:20px 18px;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(61,155,255,.25)}
.start::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,transparent 0 12%,rgba(4,16,31,.16) 12.5% 18%,transparent 18.5% 33%,rgba(4,16,31,.12) 33.5% 36%,transparent 36.5% 49%,rgba(4,16,31,.14) 49.5% 51%,transparent 52%)}
.start .ic{width:54px;height:54px;flex:0 0 auto;background:var(--on-accent);clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);display:grid;place-items:center}
.start .ic svg{width:22px;height:22px;fill:var(--accent);margin-left:3px}
.start b{display:block;font-size:22px;font-weight:800;line-height:1.1}
.start span{font-size:14px;font-weight:600;opacity:.85}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{appearance:none;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;color:var(--ink);min-height:128px}
.tile svg{width:30px;height:30px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile svg .a{stroke:var(--accent)}
.tile b{font-size:17px;font-weight:700;line-height:1.15}
.tile span{font-size:13px;color:var(--muted);line-height:1.3}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px;display:flex;flex-direction:column;gap:4px}
.stat b{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted);line-height:1.25}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0;padding-top:0}
.li .t{font-weight:700}
.li .s{font-size:14px;color:var(--muted)}

.pcard.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pcard h2{font-size:21px;font-weight:800}
.daypills{display:flex;flex-wrap:wrap;gap:6px}
.daypills span{font-size:13px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.dayhead{display:flex;gap:8px;align-items:center}
.dayhead input{font-weight:800;font-size:20px;border:0;border-bottom:2px solid var(--line);background:transparent;padding:4px 0;flex:1;min-width:0;border-radius:0}
.dayhead input:focus{outline:none;border-bottom-color:var(--accent)}
.dayhead select{min-height:38px;border:1px solid var(--line);border-radius:999px;background:var(--surface2);padding:4px 10px}
.entry{display:flex;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.entry .grow{display:flex;flex-direction:column;gap:2px}
.entry .t{font-weight:700;line-height:1.2}
.entry .s{font-size:13px;color:var(--muted)}
.entry .ctl{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.savebar{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;gap:8px;align-items:center;background:rgba(22,24,29,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:6px}
.savebar .btn{min-height:44px}
.savebar .state{flex:1;min-width:0;font-size:13px;font-weight:600;padding-left:10px;color:var(--muted);line-height:1.2}
.savebar .state.dirty{color:var(--ink)}
.savebar .state.dirty::before{content:"● ";color:var(--accent)}

.exitem{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px 8px 8px;cursor:pointer;text-align:left;width:100%;appearance:none;color:var(--ink)}
.thumb{flex:0 0 auto;width:76px;height:76px;border-radius:12px;background:var(--surface2);overflow:hidden;display:grid;place-items:center}
.thumb svg{width:76px;height:78px}
.thumb img{width:100%;height:100%;object-fit:cover}
.exitem .grow{display:flex;flex-direction:column;gap:5px}
.exitem .t{font-weight:700;line-height:1.2}
.exitem .s{font-size:13px;color:var(--muted)}
.figbox{background:var(--surface2);border-radius:var(--r);padding:8px;display:grid;place-items:center}
.figbox svg{width:100%;max-width:300px;height:auto}
.photo{border-radius:var(--r);overflow:hidden;background:var(--surface2)}
.photo img{display:block;width:100%;max-height:340px;object-fit:contain}
.fig-floor{stroke:var(--line);stroke-width:2}
.fp{fill:var(--prop);stroke:var(--prop)}
.fl{stroke:var(--fig);stroke-linecap:round;stroke-linejoin:round;fill:none}
.fl2{stroke:var(--fig2);stroke-linecap:round;stroke-linejoin:round;fill:none}
.bfgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bftile{appearance:none;background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--ink);text-align:center}
.bftile svg{display:block;width:100%;max-width:96px;height:auto;margin:0 auto}
.bftile b{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.bftile span{font-size:12px;color:var(--muted);line-height:1.25}
.bftile[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.bftile[aria-pressed="true"] b::before{content:"✓ ";color:var(--accent)}
.bftile .pane{display:block;width:100%;border-radius:10px;padding:6px 0 0;background:#BFDDF6}
.bftile.f .pane{background:#D9C8F2}
.bfb{fill:#EDC3A2;stroke:#B9825F;stroke-width:.7}
.bfh{fill:#6E4A33}
.bfs{fill:#D9A784}
.bfs2{fill:#DCAB88}
.bfl{fill:none;stroke:#B47E5C;stroke-width:.8;stroke-linecap:round}
.bfc{fill:#30343B;stroke:#1E2126;stroke-width:.5}
.bfn{fill:#B47E5C}
.fh{fill:var(--fig)}
.thumb.il-bg,.figbox{background:#EEF1F5}
.il .fig-floor{stroke:#D3D8DF;stroke-width:2}
.il .fp{fill:#A3A9B1;stroke:#A3A9B1}
.il .fb{fill:#E2E5EA;stroke:#FFFFFF;stroke-width:1}
.il .fb2{fill:#CBD0D7;stroke:#FFFFFF;stroke-width:1}
.il .fh{fill:#D4D8DE;stroke:#FFFFFF;stroke-width:1}
.il .fb.fx,.il .fb2.fx,.il .fxf{fill:#1F86EE}
.il .fb.fs,.il .fb2.fs{fill:#A9D0F8}
.il .fsh{fill:#9EA4AC;stroke:#FFFFFF;stroke-width:1}
.il .fsh2{fill:#8D939B;stroke:#FFFFFF;stroke-width:1}
.il .eqp{fill:#9AA0A8;stroke:#7B8189;stroke-width:3}
.il .eqf{fill:#7B8189}
.il .eql{stroke:#7B8189}
.il .eqband{stroke:#1F86EE}
.il .sil{fill:#D9DDE3}
.il .sil2{fill:#C2C8D0}
.il .mu{fill:#E7EAEE;stroke:#F7F8FA;stroke-width:.7}
.il .mu2{fill:#CDD2D9;stroke:#DCE0E5;stroke-width:.6}
.il .ghost .mu,.il .ghost .mu2,.il .ghost .mul{display:none}
.il .mu.fx,.il .mu2.fx{fill:#1F86EE}
.il .mu2.fx{fill:#1A6CC2}
.il .mu.fs{fill:#A9D0F8}
.il .mu2.fs{fill:#8EBCEA}
.il .mul{stroke:#FFFFFF;stroke-width:1;fill:none;stroke-linecap:round;opacity:.9}
.il .hd{fill:#D9DDE3;stroke:#FFFFFF;stroke-width:1}
.il .shoe{fill:#7E848C}
.il .shoe2{fill:#6C7279}
.il .ghost{opacity:.28}
.il .arw{fill:none;stroke:#1F86EE;stroke-width:2.6;stroke-linecap:round}
.il .arwh{fill:#1F86EE}
.fb{fill:var(--fig)}
.fb2{fill:var(--fig2)}
.fb.fx{fill:var(--accent)}
.fb2.fx{fill:var(--accent-deep)}
.hero{position:relative;overflow:hidden;border-radius:24px;border:1px solid var(--line);background:radial-gradient(70% 90% at 78% 40%,rgba(61,155,255,.32),transparent 62%),linear-gradient(160deg,#151a24,#0d0f14 70%);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:end;min-height:220px}
.hero .txt{padding:22px 0 22px 18px;display:flex;flex-direction:column;gap:6px;align-self:center;position:relative;z-index:1}
.hero h1{font-size:30px;line-height:1.05}
.hero p{color:var(--muted)}
.hero .tagline{font-family:var(--f-display);font-style:italic;font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.02em;color:var(--accent);line-height:1}
.hero .art{position:relative;height:100%;min-height:220px}
.hero .art svg{position:absolute;right:-6px;bottom:-4px;width:118%;max-width:none;height:auto}
.hero .art::before{content:"";position:absolute;right:8%;bottom:14%;width:72%;aspect-ratio:1;border-radius:50%;border:2px solid rgba(61,155,255,.35);box-shadow:0 0 40px rgba(61,155,255,.25) inset}
.hero .fig-floor{stroke:rgba(61,155,255,.5)}
.fl.fx{stroke:var(--accent)}
.fl2.fx{stroke:var(--accent-deep)}
.fxf{fill:var(--accent)}
.eqp{fill:none;stroke:var(--eqc);stroke-width:4}
.eqf{fill:var(--eqc)}
.eql{stroke:var(--eqc);fill:none}
.eqband{stroke:var(--accent);stroke-width:2.2;stroke-dasharray:4 3;fill:none}
.mb{fill:#272A31}
.mx{fill:var(--base);stroke:var(--surface);stroke-width:1}
.mp{fill:var(--accent);stroke:#fff;stroke-width:1.2}
.ms{fill:url(#hatch);stroke:var(--hatch);stroke-width:.8}
.h-bg{fill:var(--base)}
.h-ln{stroke:var(--hatch);stroke-width:1.6}
.figs{display:flex;justify-content:center;gap:12px}
.figs figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.figs svg{width:84px;height:150px}
.figs figcaption{font-size:12px;font-weight:700;color:var(--muted)}
.musc{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.musc .grow{display:flex;flex-direction:column;gap:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{width:16px;height:16px}
.legend .lg2{fill:#A9D0F8}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding-left:10px}
details.info{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
details summary{cursor:pointer;font-weight:700}
details.info p{margin-top:8px;font-size:14px;color:var(--muted)}
.pickgrid{display:flex;flex-wrap:wrap;gap:8px}
.imgprev{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.imgprev img{width:72px;height:72px;object-fit:cover;border-radius:12px}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}

.sets{display:flex;flex-direction:column;gap:8px}
.setrow,.sethead{display:grid;grid-template-columns:4px 30px minmax(0,1fr) 10px minmax(0,1fr) 38px 38px;gap:6px;align-items:center}
.setrow{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:6px 8px 6px 0;overflow:hidden}
.setrow .bar{align-self:stretch;background:var(--accent);margin:-6px 0}
.setrow .n{font-weight:700;font-size:14px;padding-left:6px}
.setrow input{min-height:42px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 8px;width:100%;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.setrow .x{text-align:center;color:var(--muted)}
.setrow .ck{appearance:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--muted);background:transparent;cursor:pointer;display:grid;place-items:center;color:transparent;font-weight:900;justify-self:center}
.setrow .ck[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.setrow.done{opacity:.72}
.setrow .rm{width:32px;height:32px;justify-self:center}
.sethead{font-size:12px;font-weight:700;color:var(--muted);padding-right:8px}
.plates{background:var(--surface2);border:1px dashed var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.plates .ps{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.plate{font-family:var(--f-mono);font-size:13px;font-weight:600;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:4px 9px}
.banner{background:var(--accent-soft);border:1px solid rgba(61,155,255,.45);color:var(--ink);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-weight:600}
.banner .btn{min-height:36px;padding:4px 12px;font-size:14px}

.chart{width:100%;overflow-x:auto;background:var(--surface2);border-radius:14px;padding:6px 4px}
.chart svg{display:block;width:100%;height:auto;min-width:280px}
.chart .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.chart .axis{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.chart .area{fill:var(--accent);opacity:.14}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linejoin:round}
.chart .pt{fill:var(--bg);stroke:var(--accent);stroke-width:2}
.chart .lab{fill:var(--ink);font-family:var(--f-mono);font-size:11px;font-weight:600}
.hist .li .grow{display:flex;flex-direction:column;gap:2px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(17,19,23,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600}
.tabs a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs a[aria-current="page"]{color:var(--accent);font-weight:800}
.tabs a[aria-current="page"]::after{content:"";width:4px;height:4px;border-radius:50%;background:currentColor}
.fabwrap{display:flex;flex-direction:column;align-items:center;padding-bottom:8px;gap:2px}
.fab{appearance:none;border:0;width:58px;height:58px;margin-top:-22px;background:var(--accent);cursor:pointer;display:grid;place-items:center;clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);filter:drop-shadow(0 6px 14px rgba(61,155,255,.4))}
.fab svg{width:24px;height:24px;fill:var(--on-accent);margin-left:3px}
.fabwrap small{font-size:11px;font-weight:600;color:var(--muted)}
.fabwrap.on small{color:var(--accent);font-weight:800}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:600px;max-height:92%;overflow-y:auto;border-radius:26px 26px 0 0;border:1px solid var(--line);border-bottom:0;padding-top:12px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line)}
.sheet .sheethead{position:sticky;top:-12px;z-index:5;display:flex;justify-content:center;align-items:flex-start;height:0;overflow:visible}
.sheet .sheet-x{position:absolute;right:-4px;top:-2px;appearance:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.45)}
.sheet .sheet-x svg{width:18px;height:18px;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;fill:none}
.sheet > div:nth-child(2) h2,.sheet > h2{padding-right:48px}
.sheet h2{font-size:24px;font-weight:800}
ol.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
ol.steps li::marker{color:var(--accent);font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:90vw;text-align:center}
.calgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.calcell{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}.calcell .big{font-size:clamp(28px,8vw,40px)}
.big{font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;color:var(--muted)}
.hero{min-height:270px}
.hero .art{min-height:270px}
.hero .art svg.beast{position:absolute;right:-8%;bottom:-2px;width:118%;height:auto;max-width:none}
.hero .art::before{display:none}
.hero .tagline2{font-family:var(--f-display);font-style:italic;font-weight:800;font-size:54px;line-height:.85;text-transform:uppercase;color:transparent;-webkit-text-stroke:1.5px var(--accent);letter-spacing:.02em}
.beast .bl{fill:none;stroke:#7FBDFF;stroke-linecap:round}
.beast .beast-glow{transform-origin:100px 105px;animation:glow 3.2s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.75;transform:scale(.97)}50%{opacity:1;transform:scale(1.03)}}
.hero2{position:relative;overflow:hidden;border-radius:24px;border:1px solid var(--line);height:380px;background:radial-gradient(60% 45% at 50% 38%,rgba(61,155,255,.16),transparent 70%),radial-gradient(120% 80% at 50% 110%,#1a1f29,transparent 60%),linear-gradient(180deg,#0f1218,#08090c);isolation:isolate}
.hero2 .ring{position:absolute;left:50%;top:44px;width:250px;height:250px;margin-left:-125px;border-radius:50%;border:3px solid var(--accent);box-shadow:0 0 22px rgba(61,155,255,.75),0 0 60px rgba(61,155,255,.35),inset 0 0 22px rgba(61,155,255,.45);z-index:0}
.hero2 .statue{position:absolute;left:50%;top:0;height:100%;width:auto;max-width:none;transform:translateX(-50%);object-fit:cover;filter:grayscale(1) contrast(1.2) brightness(.82);z-index:1;-webkit-mask-image:linear-gradient(180deg,#000 55%,transparent 92%);mask-image:linear-gradient(180deg,#000 55%,transparent 92%)}
.hero2 .statue.chalk{filter:invert(1) grayscale(1) contrast(1.35) brightness(1.05);mix-blend-mode:screen;-webkit-mask-image:linear-gradient(180deg,#000 60%,transparent 96%);mask-image:linear-gradient(180deg,#000 60%,transparent 96%)}
.hero2.has-img .ring{opacity:.9}
.hero2 .mark{position:absolute;left:50%;top:116px;width:110px;margin-left:-55px;fill:var(--accent);filter:drop-shadow(0 0 18px rgba(61,155,255,.7));z-index:1}
.hero2 .fade{position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(180deg,transparent,rgba(8,9,12,.92) 70%);z-index:2}
.hero2 .txt{position:absolute;left:0;right:0;bottom:22px;text-align:center;z-index:3;display:flex;flex-direction:column;gap:6px;padding-inline:16px}
.hero2 .logo{font-family:var(--f-display);font-style:italic;font-weight:800;font-size:58px;line-height:.9;letter-spacing:.03em;text-shadow:0 2px 18px rgba(0,0,0,.7)}
.hero2 .logo em{font-style:inherit;color:var(--accent)}
.hero2 .tagl{font-weight:600;font-size:16px}
.hero2 .hi{font-size:13px;color:var(--muted)}
.hero2 .heroctl{position:absolute;top:10px;right:10px;z-index:4;display:flex;gap:6px}
.hero2 .heroctl .btn{min-height:32px;padding:4px 12px;font-size:12px;background:rgba(22,24,29,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hero3{width:100%;max-width:440px;margin-inline:auto;position:relative;overflow:hidden;border-radius:26px;border:1px solid #1b2230;background:radial-gradient(70% 40% at 50% 46%,rgba(30,110,230,.18),transparent 70%),linear-gradient(160deg,#0b0e14 0%,#06070a 60%,#0a0d13 100%);padding:22px 18px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;isolation:isolate}
.hero3 .streaks{position:absolute;inset:0;z-index:-1;background:linear-gradient(118deg,transparent 0 16%,rgba(61,155,255,.55) 16.2%,transparent 16.6% 100%),linear-gradient(118deg,transparent 0 22%,rgba(255,255,255,.035) 22% 38%,transparent 38% 100%),linear-gradient(118deg,transparent 0 80%,rgba(61,155,255,.45) 80.2%,transparent 80.6% 100%),linear-gradient(118deg,transparent 0 64%,rgba(255,255,255,.03) 64% 78%,transparent 78% 100%)}
.hero3 .hi{align-self:flex-start;font-size:13px;color:var(--muted);font-weight:600}
.hero3 .brandmark{display:flex;flex-direction:column;align-items:center;gap:6px}
.hero3 .brandmark svg{width:62px;fill:var(--accent);filter:drop-shadow(0 0 12px rgba(61,155,255,.45))}
.hero3 .word{font-family:var(--f-body);font-style:italic;font-weight:800;font-size:54px;line-height:.9;letter-spacing:.08em;padding-left:.08em}
.hero3 .word em{font-style:inherit;color:var(--accent)}
.hero3 .stage{position:relative;width:100%;height:min(150vw,560px);margin-top:-6px}
.hero3 .ring{position:absolute;left:36%;top:47%;width:min(92%,470px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:3px solid #2E8BFF;box-shadow:0 0 24px rgba(46,139,255,.8),0 0 70px rgba(46,139,255,.35),inset 0 0 26px rgba(46,139,255,.4)}
.hero3 .statue{opacity:.75;position:absolute;left:50%;top:0;height:100%;width:auto;max-width:none;transform:translateX(-50%);object-fit:contain;filter:grayscale(1) contrast(1.2) brightness(.85);-webkit-mask-image:linear-gradient(180deg,#000 70%,transparent 99%);mask-image:linear-gradient(180deg,#000 70%,transparent 99%)}
.hero3 .statue.def{left:0;top:0;transform:none;height:auto;width:min(86%,440px);opacity:1;filter:brightness(.72) contrast(1.08);-webkit-mask-image:none;mask-image:none}
.hero3 .statue.def.occ{opacity:1;filter:brightness(0);-webkit-mask-image:none;mask-image:none}
.hero3 .stage{overflow:hidden;width:calc(100% + 36px);margin-inline:-18px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 34px);mask-image:linear-gradient(90deg,transparent 0,#000 34px)}
.hero3 .tagl,.hero3 .sub{position:relative;z-index:2;text-shadow:0 1px 10px rgba(0,0,0,.9)}
.hero3 .statue.chalk{filter:invert(1) grayscale(1) contrast(1.35) brightness(1.05);mix-blend-mode:screen}
.hero3 .mark{position:absolute;left:50%;top:52%;width:120px;transform:translate(-50%,-50%);fill:var(--accent);filter:drop-shadow(0 0 20px rgba(61,155,255,.7))}
.hero3 .heroimg{position:absolute;right:22px;top:12px;z-index:3;appearance:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(22,24,29,.75);display:grid;place-items:center;cursor:pointer}
.hero3 .heroimg svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hero3 .heroctl{position:absolute;right:-6px;top:-138px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.hero3 .heroctl .btn{min-height:30px;padding:3px 10px;font-size:12px;background:rgba(22,24,29,.75);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hero3 .tagl{font-weight:700;font-size:13px;letter-spacing:.2em;white-space:nowrap;text-transform:uppercase;margin-top:6px}
.hero3 .tagl b{color:var(--accent);font-weight:800}
.hero3 .sub{color:var(--muted);font-size:15px;max-width:30ch}
.hero3 .go{appearance:none;border:1px solid rgba(61,155,255,.6);width:100%;min-height:58px;border-radius:999px;margin-top:8px;cursor:pointer;color:#fff;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;gap:14px;background:linear-gradient(90deg,#0B2C66,#1F6FE0 60%,#2E8BFF);box-shadow:0 10px 30px rgba(31,111,224,.35)}
.hero3 .go svg{width:22px;height:22px;stroke:#fff;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:380px){.fields{grid-template-columns:1fr}.stats{gap:6px}.stat b{font-size:20px}.setrow,.sethead{grid-template-columns:4px 24px minmax(0,1fr) 8px minmax(0,1fr) 34px 34px;gap:4px}.thumb,.thumb svg{width:64px;height:64px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

["pushup","Pompes (push-ups)","Poids du corps","m","c","pec","tri,delt,abs","8-20","pushup","Mains un peu plus larges que les épaules, corps gainé.|Descends la poitrine près du sol, coudes à 45°.|Pousse jusqu'aux bras tendus.","Pieds surélevés pour plus de difficulté, mains surélevées pour moins."],
["dips","Dips aux barres parallèles","Poids du corps","m","c","tri,pec","delt","6-12","dips","En appui bras tendus, épaules basses.|Descends jusqu'aux bras parallèles au sol.|Remonte jusqu'aux bras tendus.","Buste penché : plus de pectoraux. Buste droit : plus de triceps."],
["deadlift","Soulevé de terre (deadlift)","Barre","m","c","lowb,glu,ham","trap,quad,fa,lat","3-6","deadlift","Pieds sous la barre, prise juste à l'extérieur des jambes.|Dos neutre, pousse dans le sol en gardant la barre contre les jambes.|Verrouille les hanches debout, puis redescends en reculant les hanches.","Si le bas du dos s'arrondit, la charge est trop lourde."],
["pullup","Tractions (pull-ups)","Poids du corps","m","c","lat","bic,fa","5-10","pullup","Suspendu, prise en pronation un peu plus large que les épaules.|Tire les coudes vers le bas jusqu'à passer le menton au-dessus de la barre.|Redescends contrôlé.","Utilise un élastique ou la machine assistée pour progresser."],
["chinup","Tractions supination (chin-ups)","Poids du corps","m","c","lat,bic","fa","5-10","pullup","Paumes vers toi, mains à la largeur des épaules.|Monte jusqu'au menton au-dessus de la barre.|Redescends lentement.","Sollicite davantage les biceps que la prise en pronation."],
["assistpull","Traction assistée à la machine","Machine","m","c","lat","bic","8-12","pullup","Genoux sur la plateforme, choisis le contrepoids.|Tire jusqu'au menton au-dessus des poignées.|Redescends contrôlé.","Plus le contrepoids est lourd, plus c'est facile."],
["pulldown","Tirage vertical à la poulie","Poulie","m","c","lat","bic","8-12","pulldown","Assis, cuisses calées, prise large.|Tire la barre vers le haut de la poitrine en abaissant les épaules.|Remonte jusqu'aux bras tendus.","Ne tire pas derrière la nuque."],
["cgpulldown","Tirage vertical prise serrée neutre","Poulie","m","c","lat","bic","8-12","pulldown","Poignée triangle, paumes face à face.|Tire vers le sternum, coudes près du corps.|Remonte lentement.","Belle amplitude pour le bas des dorsaux."],
["straightpd","Pull-over à la poulie, bras tendus","Poulie","m","i","lat","tri","12-15","straightarm","Debout face à la poulie haute, buste un peu penché.|Bras presque tendus, ramène la barre vers les cuisses.|Remonte lentement.","Isole les dorsaux sans faire travailler les biceps."],
["bbrow","Rowing barre penché","Barre","m","c","lat","bic,delt,lowb,trap","6-10","bentrow","Buste penché à environ 45°, dos neutre.|Tire la barre vers le nombril en serrant les omoplates.|Redescends contrôlé.","Ne te redresse pas pour tricher sur les dernières reps."],
["tbar","Rowing T-bar","Barre","m","c","lat","bic,trap,delt","8-10","bentrow","À cheval sur la barre, buste penché, dos neutre.|Tire la poignée vers le bas de la poitrine.|Redescends jusqu'aux bras tendus.","Variante guidée qui se charge lourd."],
["csrow","Rowing poitrine appuyée","Machine","m","c","lat","bic,trap,delt","8-12","csrow","Poitrine contre le coussin, bras tendus.|Tire les poignées vers les côtes.|Relâche lentement.","Le coussin retire la charge du bas du dos."],
["dbrow","Rowing un bras à l'haltère","Haltères","m","c","lat","bic,delt","8-12","bentrow","Un genou et une main sur le banc, dos plat.|Tire l'haltère vers la hanche, coude près du corps.|Redescends jusqu'à l'étirement.","Pense à tirer avec le coude, pas avec la main."],
["cablerow","Tirage horizontal assis à la poulie","Poulie","m","c","lat","bic,delt,trap","8-12","seatedrow","Assis, dos droit, bras tendus.|Tire la poignée vers le ventre en serrant les omoplates.|Reviens en laissant les épaules s'avancer.","Le buste reste stable : ce n'est pas un balancier."],
["machrow","Rowing assis à la machine","Machine","m","c","lat","bic,trap,delt","8-12","seatedrow","Règle le siège et le coussin de poitrine.|Tire les poignées vers les côtes.|Contrôle le retour.","Prise neutre : plus de dorsaux. Prise large : plus de haut du dos."],
["backext","Extensions lombaires (banc à 45°)","Poids du corps","m","i","lowb,glu","ham","12-15","backext","Hanches sur le coussin, pieds calés.|Descends le buste en fléchissant les hanches.|Remonte jusqu'à l'alignement, sans cambrer.","Tiens un disque contre la poitrine pour ajouter de la charge."],
["goodmorning","Good morning","Barre","m","c","ham,lowb","glu","8-10","goodmorning","Barre sur le haut du dos, genoux légèrement fléchis.|Recule les hanches et penche le buste, dos neutre.|Remonte en poussant les hanches vers l'avant.","Commence léger : c'est exigeant pour le bas du dos."],
["shrug","Haussements d'épaules aux haltères","Haltères","m","i","trap","fa","10-15","shrug","Debout, haltères le long du corps.|Monte les épaules vers les oreilles.|Tiens une seconde, puis redescends.","Ne roule pas les épaules."],
["bbshrug","Haussements d'épaules à la barre","Barre","m","i","trap","fa","10-15","shrug","Barre devant les cuisses, prise à la largeur des épaules.|Monte les épaules à la verticale.|Redescends lentement.","Des sangles aident si la prise lâche avant les trapèzes."],
["ohp","Développé militaire debout","Barre","m","c","delt","tri,trap","5-8","ohp","Barre sur le haut de la poitrine, mains un peu plus larges que les épaules.|Pousse à la verticale en passant la tête sous la barre.|Verrouille en haut, puis redescends.","Serre fessiers et abdos pour ne pas te cambrer."],
["dbsp","Développé épaules aux haltères","Haltères","m","c","delt","tri","8-12","seatohp","Assis, dossier vertical, haltères à la hauteur des oreilles.|Pousse jusqu'aux bras presque tendus.|Redescends à la hauteur des oreilles.","Garde le dos collé au dossier."],
["arnold","Développé Arnold","Haltères","m","c","delt","tri","8-12","seatohp","Assis, haltères devant les épaules, paumes vers toi.|Pousse en tournant les paumes vers l'avant.|Reviens en inversant la rotation.","La rotation ajoute de l'amplitude à l'avant de l'épaule."],
["machsp","Développé épaules à la machine","Machine","m","c","delt","tri","8-12","seatohp","Poignées à la hauteur des épaules.|Pousse vers le haut.|Contrôle la descente.","Bon choix pour pousser près de l'échec."],
["latraise","Élévations latérales aux haltères","Haltères","m","i","delt","trap","12-20","latraise","Debout, coudes légèrement fléchis.|Monte les bras sur les côtés jusqu'à la hauteur des épaules.|Redescends lentement.","Mène avec les coudes, pas avec les mains."],
["cablelat","Élévation latérale à la poulie","Poulie","m","i","delt","trap","12-15","latraise","Poulie basse du côté opposé, poignée en main.|Monte le bras sur le côté jusqu'à l'épaule.|Redescends contrôlé.","Tension constante, même en bas du mouvement."],
["machlat","Élévations latérales à la machine","Machine","m","i","delt","","12-15","latraise","Coussins sur l'extérieur des bras.|Monte les coudes jusqu'à la hauteur des épaules.|Redescends lentement.","Garde les épaules basses."],
["frontraise","Élévations frontales","Haltères","m","i","delt","pec","10-15","frontraise","Debout, haltères devant les cuisses.|Monte devant toi jusqu'à la hauteur des yeux.|Redescends lentement.","L'avant de l'épaule travaille déjà beaucoup dans les développés."],
["facepull","Face pull à la poulie","Poulie","m","i","delt","trap,rc","12-15","facepull","Corde à la poulie haute.|Tire vers le visage en écartant les mains, coudes hauts.|Reviens lentement.","Excellent pour l'arrière des épaules et leur santé."],
["reardelt","Oiseau aux haltères","Haltères","m","i","delt","trap","12-15","reardelt","Buste penché presque à l'horizontale.|Ouvre les bras sur les côtés, coudes légèrement fléchis.|Redescends contrôlé.","Cible l'arrière des épaules."],
["revpec","Pec deck inversé","Machine","m","i","delt","trap","12-15","revpecdeck","Face à la machine, poitrine contre le coussin.|Ouvre les bras vers l'arrière.|Reviens lentement.","Garde les bras presque tendus."],
["bcurl","Curl à la barre","Barre","m","i","bic","fa","8-12","curl","Debout, barre en supination à la largeur des épaules.|Monte la barre, coudes fixes le long du corps.|Redescends jusqu'aux bras tendus.","Si tu dois balancer le dos, la charge est trop lourde."],
["ezcurl","Curl à la barre EZ","Barre EZ","m","i","bic","fa","8-12","curl","Mains sur les parties inclinées de la barre.|Monte en gardant les coudes fixes.|Redescends lentement.","Plus confortable pour les poignets que la barre droite."],
["hammer","Curl marteau","Haltères","m","i","bic,fa","","10-12","curl","Haltères en prise neutre, paumes face à face.|Monte en gardant la prise neutre.|Redescends contrôlé.","Développe aussi le brachial et les avant-bras."],
["inccurl","Curl incliné aux haltères","Haltères","m","i","bic","","10-12","inccurl","Assis sur un banc incliné à 45°, bras pendants.|Fléchis les coudes sans avancer les épaules.|Redescends jusqu'à l'étirement complet.","L'étirement en bas du mouvement fait toute la différence."],
["cablecurl","Curl à la poulie basse","Poulie","m","i","bic","fa","10-15","curl","Face à la poulie basse, barre ou corde en main.|Monte en gardant les coudes fixes.|Redescends lentement.","Tension continue sur tout le mouvement."],
["preacher","Curl pupitre","Barre EZ","m","i","bic","","8-12","preacher","Arrière des bras sur le pupitre.|Monte la barre jusqu'à ce que les avant-bras soient verticaux.|Redescends lentement sans verrouiller brusquement.","Le pupitre empêche de tricher avec le dos."],
["machcurl","Curl biceps à la machine","Machine","m","i","bic","","10-15","preacher","Coudes alignés avec l'axe de la machine.|Fléchis jusqu'en haut.|Contrôle le retour.","Facile à pousser près de l'échec."],
["conc","Curl concentré","Haltères","m","i","bic","","10-12","conc","Assis, coude appuyé à l'intérieur de la cuisse.|Monte l'haltère vers l'épaule.|Redescends complètement.","Un bras à la fois, sans élan."],
["cgbench","Développé couché prise serrée","Barre","m","c","tri,pec","delt","6-10","bench","Mains à la largeur des épaules.|Descends vers le bas de la poitrine, coudes près du corps.|Pousse jusqu'aux bras tendus.","Une prise trop serrée stresse les poignets."],
["skull","Barre au front (skull crusher)","Barre EZ","m","i","tri","","8-12","skull","Couché, barre au-dessus du front, bras verticaux.|Fléchis les coudes pour descendre vers le front.|Tends les bras sans écarter les coudes.","Laisser la barre passer un peu derrière la tête augmente l'étirement."],
["pushdown","Extension triceps à la poulie (pushdown)","Poulie","m","i","tri","","10-15","pushdown","Face à la poulie haute, coudes collés au corps.|Pousse vers le bas jusqu'aux bras tendus.|Remonte sans bouger les coudes.","Avec la corde, écarte les mains en bas."],
["ohext","Extension triceps au-dessus de la tête","Haltères","m","i","tri","","10-12","ohext","Un haltère tenu à deux mains au-dessus de la tête.|Descends derrière la tête en fléchissant les coudes.|Remonte bras tendus.","Garde les coudes orientés vers l'avant."],
["cableohext","Extension triceps à la poulie au-dessus de la tête","Poulie","m","i","tri","","10-15","ohext","Dos à la poulie, corde derrière la tête.|Tends les bras vers l'avant et le haut.|Reviens lentement à l'étirement.","Étire bien la longue portion du triceps."],
["kickback","Kickback triceps","Haltères","m","i","tri","","12-15","kickback","Buste penché, bras collé au corps, coude à 90°.|Tends le bras vers l'arrière.|Reviens lentement.","Le bras reste immobile, seul l'avant-bras bouge."],
["benchdip","Dips entre deux bancs","Poids du corps","m","c","tri","pec,delt","10-15","benchdip","Mains sur le bord du banc derrière toi, jambes devant.|Descends en fléchissant les coudes.|Remonte jusqu'aux bras tendus.","Ne descends pas plus bas que les bras parallèles au sol."],
["machdip","Dips à la machine","Machine","m","c","tri","pec","8-12","seatdip","Assis, poignées à la hauteur des côtes.|Pousse vers le bas jusqu'aux bras tendus.|Remonte contrôlé.","Version stable des dips."],
["wristcurl","Curl poignets","Barre","m","i","fa","","15-20","wrist","Assis, avant-bras sur les cuisses, paumes vers le haut.|Laisse la barre rouler vers le bout des doigts.|Referme la main et monte le poignet.","Le mouvement est court, c'est normal."],
["revwrist","Curl poignets en pronation","Barre","m","i","fa","","15-20","wrist","Avant-bras sur les cuisses, paumes vers le bas.|Monte le dos de la main.|Redescends lentement.","Utilise une charge légère."],
["crunch","Crunch au sol","Poids du corps","m","i","abs","","12-20","crunch","Couché, genoux fléchis, pieds au sol.|Enroule le haut du dos en rapprochant les côtes du bassin.|Redescends lentement.","Expire en montant. Ne tire pas sur la nuque."],
["hlr","Relevés de jambes suspendu","Poids du corps","m","i","abs","obl,fa","8-15","hlr","Suspendu à la barre, bras tendus.|Monte les jambes en enroulant le bassin.|Redescends sans balancer.","Genoux fléchis pour la version plus facile."],
["cablecrunch","Crunch à la poulie haute","Poulie","m","i","abs","obl","10-15","cablecrunch","À genoux face à la poulie, corde près de la tête.|Enroule le buste vers le bas.|Remonte lentement.","Les hanches restent fixes."],
["machcrunch","Crunch à la machine","Machine","m","i","abs","","10-15","seatcrunch","Assis, poignées à la hauteur de la poitrine.|Enroule le buste vers l'avant.|Reviens lentement.","Pense à rapprocher les côtes du bassin."],
["abwheel","Roulette abdominale","Poids du corps","m","c","abs","lat,delt","6-12","abwheel","À genoux, mains sur la roulette.|Roule vers l'avant en gardant le dos plat.|Reviens en contractant les abdos.","N'avance que jusqu'où tu gardes le bas du dos neutre."],
["legraise","Relevés de jambes couché","Poids du corps","m","i","abs","","10-15","legraise","Couché sur le dos, jambes tendues.|Monte les jambes à la verticale.|Redescends lentement sans cambrer.","Mains sous les fesses pour protéger le bas du dos."],
["woodchop","Rotation à la poulie (woodchopper)","Poulie","m","i","obl","abs","10-15","woodchop","De côté à la poulie haute, poignée à deux mains.|Tire en diagonale vers le bas en tournant le buste.|Reviens contrôlé, puis change de côté.","La rotation vient du tronc, bras presque tendus."],
["plank","Planche","Poids du corps","m","i","abs","obl,delt","30-60 s","plank","Appui sur les avant-bras et les orteils.|Aligne tête, dos et talons, serre abdos et fessiers.|Tiens la position en respirant.","Note la durée en secondes dans le champ des reps."],
["squat","Squat arrière à la barre","Barre","m","c","quad,glu","ham,lowb,add","5-8","squat","Barre sur le haut du dos, pieds à la largeur des épaules.|Descends en poussant les hanches vers l'arrière, genoux dans l'axe des pieds.|Remonte en poussant dans le sol, poitrine haute.","Descends au moins jusqu'aux cuisses parallèles si ta mobilité le permet."],
["fsquat","Squat avant","Barre","m","c","quad","glu,abs","5-8","frontsquat","Barre sur l'avant des épaules, coudes hauts.|Descends en gardant le buste droit.|Remonte en gardant les coudes hauts.","Plus exigeant pour le haut du dos et les poignets."],
["goblet","Squat gobelet","Kettlebell","m","c","quad,glu","abs","8-12","frontsquat","Kettlebell tenu contre la poitrine.|Descends entre tes genoux, buste droit.|Remonte en poussant dans les talons.","Idéal pour apprendre le squat."],
["hacksquat","Hack squat","Machine","m","c","quad","glu","8-12","squat","Dos contre le dossier, épaules sous les appuis.|Descends le plus bas possible en contrôle.|Pousse sans verrouiller les genoux.","Pieds plus bas sur la plateforme : plus de quadriceps."],
["smithsquat","Squat à la Smith","Machine","m","c","quad,glu","ham","8-12","squat","Barre guidée sur le haut du dos, pieds légèrement devant.|Descends jusqu'aux cuisses parallèles.|Remonte et rebloque en fin de série.","La position des pieds change beaucoup le travail : teste-la à vide."],
["pendulum","Squat pendulaire","Machine","m","c","quad","glu","8-12","squat","Dos contre le coussin, épaules sous les appuis.|Descends en arc jusqu'au fond.|Remonte sans verrouiller.","Très bon pour les quadriceps avec peu de stress pour le dos."],
["beltsquat","Belt squat","Machine","m","c","quad,glu","add","8-12","squat","Ceinture autour des hanches, charge entre les jambes.|Descends en gardant le buste droit.|Remonte en poussant dans le sol.","Charge les jambes sans comprimer la colonne."],
["legpress","Presse à cuisses","Machine","m","c","quad,glu","ham,add","10-15","legpress","Dos et bassin collés au siège, pieds à la largeur des épaules.|Descends la plateforme en fléchissant les genoux.|Pousse sans verrouiller les genoux.","Ne laisse pas le bassin décoller du siège en bas."],
["legext","Extension des jambes","Machine","m","i","quad","","10-15","legext","Assis, genoux alignés avec l'axe de la machine.|Tends les jambes jusqu'en haut.|Redescends lentement.","Pause d'une seconde jambes tendues."],
["legcurl","Flexion des jambes couché","Machine","m","i","ham","calf","10-12","legcurl","Couché sur le ventre, rouleau juste au-dessus des talons.|Ramène les talons vers les fessiers.|Redescends lentement.","Garde les hanches collées au banc."],
["seatlegcurl","Flexion des jambes assis","Machine","m","i","ham","","10-12","seatlegcurl","Assis, rouleau sous les mollets, cuisses bloquées.|Fléchis les genoux le plus loin possible.|Reviens lentement.","La position assise étire davantage les ischios."],
["rdl","Soulevé de terre roumain","Barre","m","c","ham,glu","lowb","6-10","hinge","Debout, barre à la hauteur des cuisses, genoux légèrement fléchis.|Recule les hanches en glissant la barre le long des jambes.|Pousse les hanches vers l'avant pour revenir debout.","Le mouvement vient des hanches. Arrête quand le dos commence à s'arrondir."],
["dbrdl","Soulevé de terre roumain aux haltères","Haltères","m","c","ham,glu","lowb","8-12","hinge","Haltères devant les cuisses.|Recule les hanches jusqu'à l'étirement des ischios.|Reviens debout en serrant les fessiers.","Garde les haltères près des jambes."],
["slrdl","Soulevé de terre roumain sur une jambe","Haltères","m","c","ham,glu","lowb,abs,gmed","8-10","slrdl","Debout sur une jambe, haltère dans la main opposée.|Penche le buste en levant la jambe libre derrière toi.|Reviens debout sans tourner le bassin.","Travaille aussi l'équilibre et le moyen fessier."],
["bulg","Fente bulgare","Haltères","m","c","quad,glu","ham,add","8-12","bulg","Pied arrière posé sur un banc, haltères en main.|Descends le genou arrière vers le sol.|Remonte en poussant dans le pied avant.","Pas plus long : plus de fessiers. Pas plus court : plus de quadriceps."],
["lunge","Fentes marchées","Haltères","m","c","quad,glu","ham","10-12","lunge","Haltères en main, fais un grand pas en avant.|Descends jusqu'à ce que le genou arrière frôle le sol.|Pousse et enchaîne avec l'autre jambe.","Compte les reps par jambe."],
["revlunge","Fente arrière","Haltères","m","c","glu,quad","ham","8-12","lunge","Debout, haltères en main.|Fais un pas en arrière et descends le genou vers le sol.|Reviens en poussant dans le pied avant.","Plus facile pour les genoux que la fente avant."],
["stepup","Montée sur banc (step-up)","Haltères","m","c","quad,glu","ham","8-12","stepup","Un pied sur le banc ou la boîte.|Monte en poussant dans le pied du haut.|Redescends lentement.","Évite de pousser avec la jambe du bas."],
["hipthrust","Hip thrust à la barre","Barre","m","c","glu","ham","8-12","hipthrust","Haut du dos sur un banc, barre sur les hanches avec un coussin.|Monte les hanches jusqu'à l'alignement épaules-genoux.|Redescends contrôlé.","Serre les fessiers une seconde en haut, menton rentré."],
["machthrust","Hip thrust à la machine","Machine","m","c","glu","ham","8-12","hipthrust","Dos contre l'appui, ceinture ou coussin sur les hanches.|Monte les hanches jusqu'à l'alignement.|Redescends lentement.","Plus simple à installer que la version à la barre."],
["bridge","Pont fessier au sol","Poids du corps","m","i","glu","ham","12-20","bridge","Couché, genoux fléchis, pieds au sol.|Monte les hanches en serrant les fessiers.|Redescends sans poser complètement.","Ajoute un haltère sur les hanches pour progresser."],
["abdmach","Abduction de hanche à la machine","Machine","m","i","gmed","glu","12-20","abd","Assis, coussins à l'extérieur des genoux.|Écarte les genoux le plus loin possible.|Reviens lentement.","Cible le moyen fessier, important pour la stabilité du genou."],
["addmach","Adduction de hanche à la machine","Machine","m","i","add","","12-20","add","Assis, coussins à l'intérieur des genoux.|Rapproche les jambes.|Reviens lentement à l'étirement.","Utile pour la santé de l'aine."],
["cablekick","Kickback fessier à la poulie","Poulie","m","i","glu","ham","12-15","kickleg","Sangle à la cheville, face à la poulie basse.|Pousse la jambe vers l'arrière, genou presque tendu.|Reviens sans cambrer.","Garde le bassin face à la machine."],
["kbswing","Swing au kettlebell","Kettlebell","m","c","glu,ham","lowb,delt,abs","15-20","swing","Pieds un peu plus larges que les hanches, kettlebell devant toi.|Fais-le passer entre les jambes en reculant les hanches.|Projette les hanches vers l'avant pour le monter à la hauteur des épaules.","C'est un mouvement de hanches, pas un lever de bras."],
["calfst","Mollets debout","Machine","m","i","calf","","10-15","calf","Épaules sous les appuis, avant des pieds sur la marche.|Descends les talons pour étirer.|Monte sur la pointe des pieds le plus haut possible.","Pause en bas pour éliminer le rebond."],
["calfseat","Mollets assis","Machine","m","i","calf","","12-20","calfseat","Assis, genoux sous le coussin, avant des pieds sur la marche.|Descends les talons.|Monte le plus haut possible.","Genoux fléchis : cible surtout le soléaire."],
["presscalf","Mollets à la presse","Machine","m","i","calf","","12-15","presscalf","Avant des pieds sur le bas de la plateforme, jambes tendues.|Laisse les talons descendre.|Pousse avec les orteils.","Ne verrouille pas complètement les genoux."],

function plates(totalLb){

  s += `<path class="bfs" opacity=".4" d="M${c+thighO-1.2},106 Q${c+thighO-1},124 ${c+knee+.2},140 L${c+knee-2.2},140 Q${c+thighO-4},124 ${c+thighO-4},106Z"/>`;
  // détails anatomiques
  const L = (d, o = 1) => `<path class="bfl" opacity="${o.toFixed(2)}" d="${d}"/>`;
  s += L(`M${c-3},36.5 Q${c-9},35.4 ${c-15},37.8 M${c+3},36.5 Q${c+9},35.4 ${c+15},37.8`, .55);
  if (!F){
    s += L(`M${c-16.5},${45+fOp*2} Q${c-10},${54+fOp*5} ${c-1.2},${50+fOp*3} M${c+16.5},${45+fOp*2} Q${c+10},${54+fOp*5} ${c+1.2},${50+fOp*3}`, .45 + dOp*.4);
    s += `<circle class="bfn" cx="${c-9.4}" cy="${48.5+fOp*4}" r=".8"/><circle class="bfn" cx="${c+9.4}" cy="${48.5+fOp*4}" r=".8"/>`;
  }
  if (dOp > 0){
    s += L(`M${c},53 V${92}`, dOp*.8);
    if ((!F && bf <= 19) || (F && bf <= 22)){
      for (const y of [61, 68.5, 76]) s += L(`M${c-6.4},${y} Q${c-3.2},${y+1.6} ${c},${y} Q${c+3.2},${y+1.6} ${c+6.4},${y}`, dOp*.75);
      s += L(`M${c-6.8},55 Q${c-8.4},70 ${c-6.2},84 M${c+6.8},55 Q${c+8.4},70 ${c+6.2},84`, dOp*.7);
    }
    s += L(`M${c-12.6},79 Q${c-8},88 ${c-2.8},95 M${c+12.6},79 Q${c+8},88 ${c+2.8},95`, dOp*.75);
    s += L(`M${c-shoulder-ox+.4},41 Q${c-shoulder-ox+3},47 ${c-shoulder-ox+2.2},53 M${c+shoulder+ox-.4},41 Q${c+shoulder+ox-3},47 ${c+shoulder+ox-2.2},53`, dOp*.6);
    s += L(`M${c-thighO+3.6},108 Q${c-9},120 ${c-5.6},136 M${c+thighO-3.6},108 Q${c+9},120 ${c+5.6},136`, dOp*.55);
  }
  s += L(`M${c-knee+2.4},145 Q${c-8},148.5 ${c-5.2},145 M${c+knee-2.4},145 Q${c+8},148.5 ${c+5.2},145`, .45);
  s += `<ellipse class="bfn" cx="${c}" cy="${84 + K*.12}" rx=".9" ry="${(1 + K*.03).toFixed(2)}"/>`;
  if (fOp > 0) s += L(`M${c-waist-K*.1+2.6},${89+K*.1} Q${c},${95+K*.25} ${c+waist+K*.1-2.6},${89+K*.1}`, fOp*.8);
  if (fOp > .3) s += L(`M${c-rib+1},63 Q${c-rib+3.2},66 ${c-rib+1.4},69 M${c+rib-1},63 Q${c+rib-3.2},66 ${c+rib-1.4},69`, fOp*.6);
  // vêtements
  const sx = y => { for (let i=0;i<LEG.length-1;i++){ const [x0,y0] = LEG[i], [x1,y1] = LEG[i+1]; if (y >= y0 && y <= y1) return x0 + (x1-x0)*(y-y0)/(y1-y0); } return LEG[0][0]; };
  const top = F ? 90 : 89, bot = F ? 112 : 117, inner = lerp(thighI+.3, .5, (bot-114 < 0 ? 0 : 0)) ;
  s += `<path class="bfc" d="M${f1(c-sx(top)-.5)},${top} Q${c},${top+1.4} ${f1(c+sx(top)+.5)},${top} L${f1(c+sx(bot)+.5)},${bot} Q${f1(c+thighI+4)},${bot+1} ${f1(c+thighI+.3)},${bot-.6} L${c},${F ? 104 : 105.5} L${f1(c-thighI-.3)},${bot-.6} Q${f1(c-thighI-4)},${bot+1} ${f1(c-sx(bot)-.5)},${bot} Z"/>`;
  if (F){
    const b = 4.2 + bf*.07;
    s += `<path class="bfc" d="M${f1(c-rib-.2)},${bustY-5} Q${f1(c-rib+1)},${bustY+b*.7} ${c-7},${bustY+b*.85} Q${c-1.6},${bustY+b*.6} ${c},${bustY+b*.2} Q${c+1.6},${bustY+b*.6} ${c+7},${bustY+b*.85} Q${f1(c+rib-1)},${bustY+b*.7} ${f1(c+rib+.2)},${bustY-5} Q${c+7},${bustY-7} ${c},${bustY-3} Q${c-7},${bustY-7} ${f1(c-rib-.2)},${bustY-5}Z"/>`;
    s += `<path class="bfc" d="M${c-9.6},${bustY-6} L${c-11.2},35.6 L${c-10},35.2 L${c-8.2},${bustY-6.4}Z M${c+9.6},${bustY-6} L${c+11.2},35.6 L${c+10},35.2 L${c+8.2},${bustY-6.4}Z"/>`;
  }
  return `<svg viewBox="12 0 76 200" aria-hidden="true">${s}</svg>`;
}
function bfSheet(){
  let sex = S.profile.sex === "F" ? "F" : "M";
  const body = () => `<h2>Estimer mon % de gras</h2>
    <p class="small muted">Choisis la silhouette qui te ressemble le plus. C'est une estimation visuelle : compte quelques points de marge d'erreur.</p>
    <div class="seg" id="bf-sex"><button data-v="M" aria-pressed="${sex==="M"}">Homme</button><button data-v="F" aria-pressed="${sex==="F"}">Femme</button></div>
    <div class="bfgrid">${(sex === "F" ? BF_F : BF_M).map(([v,r,t]) => `<button class="bftile ${sex === "F" ? "f" : "m"}" data-bf="${v}" aria-pressed="${String(+S.profile.bf === v)}"><span class="pane">${bfFig(sex, v)}</span><b>${r}</b><span>${t}</span></button>`).join("")}</div>
    <button class="btn" data-act="close">Annuler</button>`;
  openSheet(`<div id="bf-body" class="stack">${body()}</div>`, sh => {
    sh.addEventListener("click", ev => {
      const sb = ev.target.closest("#bf-sex button"); if (sb){ sex = sb.dataset.v; sh.querySelector("#bf-body").innerHTML = body(); return; }
      const t = ev.target.closest("[data-bf]"); if (!t) return;
      S.profile.bf = t.dataset.bf; S.profile.sex = sex; save(); closeSheet(); render(); toast(`% de gras estimé à environ ${t.dataset.bf} %`);
    });
  });
}

const TABS = ["accueil","seance","programmes","exercices","stats","profil"];
function current(){ const h = (location.hash || "").slice(1); return TABS.includes(h) ? h : (TABS.includes(S.ui.tab) ? S.ui.tab : "accueil"); }
function go(tab){ S.ui.tab = tab; save(); if (location.hash.slice(1) !== tab){ try { location.hash = tab; } catch(e){} } render(); window.scrollTo(0,0); }
function render(){
  const tab = current(); S.ui.tab = tab;
  document.querySelectorAll(".tabs a").forEach(a => a.setAttribute("aria-current", a.dataset.tab === tab ? "page" : "false"));
  $("#fabwrap").classList.toggle("on", tab === "seance");
  $(".gear").setAttribute("aria-current", tab === "profil" ? "page" : "false");
  const V = {accueil:vHome, seance:vSession, programmes:vPrograms, exercices:vLibrary, stats:vStats, profil:vProfile}[tab];
  $("#view").innerHTML = V();
}
const HERO_EX = {p:["delt","tri","trap"], eq:"Barre"};
function todayIdx(p){ if (!p) return -1; const wd = new Date().getDay(); return p.days.findIndex(d => d.wd === wd); }
function nextDay(p){ if (!p) return null; const wd = new Date().getDay(); for (let k=1;k<=7;k++){ const w = (wd+k)%7, i = p.days.findIndex(d => d.wd === w); if (i >= 0) return {i, k, w}; } return null; }
function startSession(){ const p = prog(); const i = todayIdx(p); if (i >= 0) S.ui.jday = i; go("seance"); }

/* ================= ACCUEIL ================= */
function vHome(){
  const q = QUOTES[QI % QUOTES.length], h = new Date().getHours();
  const hi = h < 12 ? "Bonjour" : h < 18 ? "Bon après-midi" : "Bonsoir";
  const name = (S.profile.name || "").trim();
  const p = prog(), ti = todayIdx(p), nx = ti < 0 ? nextDay(p) : null;
  const sub = !p ? "Choisis d'abord un programme actif" : ti >= 0 ? `${esc(p.name)} · aujourd'hui : ${esc(p.days[ti].name)}` : `${esc(p.name)}${nx ? ` · prochaine : ${esc(p.days[nx.i].name)} ${nx.k === 1 ? "demain" : WD_LONG[nx.w]}` : ""}`;
  return `

    segs("#g-goal", "goal", v => v); segs("#g-days", "days", Number);

function generate(goal, n, split, eqk){
  const sp = split === "auto" ? (n <= 3 ? "full" : n === 4 ? "ul" : n === 5 ? "split" : "ppl") : split;
  const L = SPLITS[sp].days, G = GOAL[goal], allowed = EQSET[eqk], sc = SCHED[n] || [];
  const names = {}, days = [];
  for (let i=0;i<n;i++){
    const [base, slots] = L[i % L.length], cyc = Math.floor(i / L.length);
    names[base] = (names[base]||0) + 1; const dn = names[base] > 1 ? `${base} ${names[base]}` : base;
    const used = new Set(), items = [];
    for (const sl of slots){
      const [key, ix] = sl.split(":"); const cands = POOL[key].filter(id => EX[id] && (!allowed || allowed.includes(EX[id].eq)) && !used.has(id));
      if (!cands.length) continue;
      const id = cands[((+ix||0) + cyc) % cands.length]; used.add(id); const e = EX[id];
      const core = e.g.includes("abs") || e.cat !== "m";
      items.push(core ? {id:uid(), ex:id, sets:3, reps:e.r, tempo:"", rest:"60 s"} : {id:uid(), ex:id, sets: e.kind === "c" ? G.sc : G.si, reps: e.kind === "c" ? G.c : G.i, tempo:G.tempo, rest: e.kind === "c" ? G.rc : G.ri});
    }
    days.push({id:uid(), name:dn, wd: sc[i] ?? -1, items});
  }
  return {id:uid(), name:`${SPLITS[sp].label} · ${G.label} · ${n} j`, days};
}

/* ================= STATS ================= */
function vStats(){
  const t = today(), wk = addDays(t, -6);
  const dates = [...new Set(S.logs.map(l => l.d))].sort().reverse();
  const week = dates.filter(d => d >= wk).length;
  const exIds = [...new Set(S.logs.map(l => l.ex))].filter(id => EX[id]).map(id => { const L = logsFor(id); return {id, last: L[0], n: L.length, best: Math.max(...L.map(l => metrics(l).e1rm))}; }).sort((a,b) => a.last.d < b.last.d ? 1 : -1);
  return `
  <h1>Journal et stats</h1>
  ${hasDemo() ? `<div class="banner"><span>Historique d'exemple affiché.</span><button class="btn" data-act="clearDemo">Effacer les exemples</button></div>` : ""}
  <section class="stats">
    <div class="stat"><b>${week}</b><span>séances sur 7 jours</span></div>
    <div class="stat"><b>${dates.length}</b><span>séances au total</span></div>
    <div class="stat"><b>${dates[0] ? fmtD(dates[0]) : "–"}</b><span>dernière séance</span></div>

  <section class="card"><h2>Par exercice</h2>

  </section>
  ${dates.length ? `<section class="card"><h2>Séances récentes</h2><div class="list">${dates.slice(0,8).map(d => { const L = S.logs.filter(l => l.d === d); return `<div class="li"><div class="grow"><div class="t">${fmtD(d, true)}</div><div class="s">${esc(L.map(l => exName(l.ex)).join(", "))}</div></div><span class="small muted">${L.length} ex.</span></div>`; }).join("")}</div></section>` : ""}`;
}
